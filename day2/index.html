<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple note-taking companion</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Welcome to QuickNotes</h2>
            <p>Organize your thoughts quickly and efficiently.</p>
        </section>
        <section>
            <h2>Shortcuts Table</h2>
            <table>
                <tr><th>Action</th><th>Shortcut</th></tr>
                <tr><td>New Note</td><td>Ctrl + N</td></tr>
                <tr><td>Save</td><td>Ctrl + S</td></tr>
            </table>
        </section>
        <section>
            <h2>Send Feedback</h2>
            <form>
                <label for="feedback">Your Feedback:</label>
                <textarea id="feedback" rows="4"></textarea>
                <button type="submit">Submit Feedback</button>
            </form>
        </section>
    </main>
</body>
</html>
